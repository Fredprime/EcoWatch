services:
  db:
    image: docker.io/postgis/postgis:16-3.4
    container_name: ecowatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecowatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecowatch_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ecowatch}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # named volume, not a bind mount: rootless podman maps bind-mount ownership badly
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
